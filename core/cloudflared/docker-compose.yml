name: cloudflared

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lab-cloudflared
    restart: unless-stopped
    # Locally-managed mode: --config is a GLOBAL flag (must precede the subcommand). Runs from the
    # mounted config.yml + credentials.json instead of the Zero Trust dashboard token.
    command: --no-autoupdate --config /etc/cloudflared/config.yml tunnel run
    volumes:
      - ./config.yml:/etc/cloudflared/config.yml:ro
      - ./credentials.json:/etc/cloudflared/credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lab-network

networks:
  lab-network:
    external: true
