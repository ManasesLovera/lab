name: monitor

services:
  monitor:
    build: .
    container_name: monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Report the host's metrics from inside the container.
      HOST_ROOT: /host
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
      # Persist the availability transition ledger across restarts.
      UPTIME_DIR: /data
    volumes:
      # Host root (read-only) for disk usage + folder breakdown.
      - /:/host:ro
      # Host process/hardware view.
      - /proc:/host/proc:ro
      # Host thermal zones + NIC info.
      - /sys:/host/sys:ro
      # Docker storage stats (`docker system df`).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host wpa_supplicant control sockets (Wi-Fi SSID / IP via wpa_cli). Must be
      # writable: wpa_cli's client socket lives here so the host daemon can reply.
      - /var/run/wpa_supplicant:/var/run/wpa_supplicant
      # Uptime history lives here, outside the container's writable layer.
      - monitor-data:/data
    devices:
      # Mailbox device used by the host's vcgencmd (GPU memory / firmware).
      - /dev/vcio:/dev/vcio
    networks:
      - lab-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lab-network:
    external: true

volumes:
  monitor-data:
